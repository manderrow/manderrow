name: 'build'

on:
  # Without types, every release event triggers it, such as editing or deleting one.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.10.*'
  ZIG_VERSION: '0.15.2'
  LINUXDEPLOY_VERSION: '1-alpha-20251107-1'
  # WiX 7 requires accepting the Open Source Maintenance Fee EULA.
  WIX_VERSION: '6.0.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-2025'
            target: 'x86_64-pc-windows-msvc'
          # Pinned, as the Xcode that the build selects must be installed on the runner.
          - platform: 'macos-26'
            target: 'aarch64-apple-darwin'
          # Qt's macOS binaries are universal, so Intel Macs are cross-compiled on the same runner.
          - platform: 'macos-26'
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    # The steps are written for bash, which is Git Bash on Windows.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # The libraries after wine's are those of Qt's xcb plugin, which linuxdeploy bundles.
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev wine64-development-tools \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0

      - name: Install linuxdeploy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          dir="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          chmod +x "$dir/linuxdeploy"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install WiX
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          echo "$USERPROFILE\.dotnet\tools" >> "$GITHUB_PATH"

      # Zig 0.15.2 cannot link against the SDK of Xcode 26.4 and later, whose libSystem.tbd lists
      # arm64e but not arm64, so even the build runner fails to link (ziglang/zig#31658).
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: echo DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer >> "$GITHUB_ENV"

      # qtshadertools for qsb, which build.rs uses to compile shaders, and qtimageformats for the
      # WebP plugin, as most of the app's images are WebP
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      # rust-toolchain.toml pins the toolchain, so the targets must be added to that one. The agent
      # is always built with the GNU ABI on Windows, whose raw-dylib imports use the runner's MinGW
      # dlltool.
      - name: Add Rust targets
        run: rustup target add ${{ matrix.target }} ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x86_64-pc-windows-gnu' || '' }}

      - name: Install Zig
        run: |
          case '${{ runner.os }}-${{ runner.arch }}' in
            Linux-X64) host=x86_64-linux ;;
            macOS-ARM64) host=aarch64-macos ;;
            macOS-X64) host=x86_64-macos ;;
            Windows-X64) host=x86_64-windows ;;
          esac
          zig="zig-$host-$ZIG_VERSION"
          if [ '${{ runner.os }}' = Windows ]; then
            # Zig is only published as a zip for Windows, which Git Bash's tar cannot extract.
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$zig.zip" -o "$RUNNER_TEMP/$zig.zip"
            7z x -bd -o"$RUNNER_TEMP" "$RUNNER_TEMP/$zig.zip" > /dev/null
          else
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$zig.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"

      # Git for Windows uses Schannel by default, the same TLS library as WinHTTP, so switch it to
      # its bundled OpenSSL. Its CA bundle is only configured when it is installed with OpenSSL.
      - name: Configure Git
        if: runner.os == 'Windows'
        run: |
          ca_bundle="$(dirname "$(dirname "$(git --exec-path)")")/etc/ssl/certs/ca-bundle.crt"
          [ -f "$ca_bundle" ] || { echo "Git's CA bundle not found: '$ca_bundle'"; exit 1; }
          git config --global http.sslBackend openssl
          git config --global http.sslCAInfo "$ca_bundle"

      - name: Build
        env:
          # git.pfaff.dev only accepts TLS 1.3, which libgit2 cannot negotiate through macOS's
          # SecureTransport or Windows' WinHTTP, so fetch git dependencies with git, whose curl can
          # use LibreSSL or OpenSSL instead.
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ runner.os != 'Linux' }}
          CURL_SSL_BACKEND: ${{ runner.os == 'macOS' && 'openssl' || '' }}
          # Qt's minimum, as the C++ code would otherwise only run on the runner's version of macOS
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          # Qt 6.10's qYieldCpu() calls __yield() without including the header that Xcode 26's Clang
          # now requires for it, which Qt 6.11 fixes.
          CXXFLAGS_aarch64_apple_darwin: '-include arm_acle.h'
        run: cargo build --release --target ${{ matrix.target }}

      # The build uses Qt's private API (in qmlcachegen's generated code), so it only runs with the
      # exact version of Qt it was built with, which must be bundled.
      - name: Bundle
        run: |
          release='target/${{ matrix.target }}/release'
          bundle="$RUNNER_TEMP/manderrow"
          mkdir -p "$bundle"
          # MSI versions must be numeric, so without any pre-release suffix
          version="$(sed -n 's/^version = "\([0-9.]*\).*"$/\1/p' Cargo.toml | head -n 1)"
          case '${{ matrix.target }}' in
            x86_64-pc-windows-msvc)
              # The bundle is also uploaded by itself, as the portable version.
              python3 -I scripts/bundle-windows.py "$release/manderrow.exe" "$RUNNER_TEMP/portable"
              wix extension add --global "WixToolset.UI.wixext/$WIX_VERSION"
              wix build -arch x64 -ext WixToolset.UI.wixext -d Version="$version" \
                -bindpath Bundle="$RUNNER_TEMP/portable" src/platforms/windows/manderrow.wxs \
                -o "$bundle/Manderrow-$version-x64.msi"
              ;;
            x86_64-unknown-linux-gnu)
              python3 -I scripts/bundle-linux.py "$release/manderrow" "$bundle/Manderrow-$version-x86_64.AppImage"
              ;;
            aarch64-apple-darwin)
              python3 -I scripts/bundle-macos.py "$release/manderrow" "$version" "$bundle/Manderrow-$version-arm64.dmg"
              ;;
            x86_64-apple-darwin)
              python3 -I scripts/bundle-macos.py "$release/manderrow" "$version" "$bundle/Manderrow-$version-x86_64.dmg"
              ;;
          esac

      # TODO: publish installers to the release, as tauri-action did.
      - uses: actions/upload-artifact@v7
        with:
          name: manderrow-${{ matrix.target }}
          path: ${{ runner.temp }}/manderrow
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x86_64-pc-windows-msvc'
        with:
          name: manderrow-${{ matrix.target }}-portable
          path: ${{ runner.temp }}/portable
          if-no-files-found: error
