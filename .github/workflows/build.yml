name: 'build'

on:
  release:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
          - platform: 'macos-13' # for Intel based macs.
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev wine64-development-tools

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtshadertools' # for qsb, which build.rs uses to compile shaders
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: cargo build --release --manifest-path src-qt/Cargo.toml

      # TODO: bundle Qt with the app (macdeployqt, windeployqt, linuxdeploy) and publish installers
      # to the release, as tauri-action did.
      - uses: actions/upload-artifact@v4
        with:
          name: manderrow-${{ matrix.platform }}
          path: |
            src-qt/target/release/manderrow
            src-qt/target/release/manderrow.exe
            agent/zig-out/libmanderrow_agent
